<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- App windows are iframes of the app's own pages (docs/apps.md §9): they may never be
         navigated to another site, so an app can't send what it reads anywhere. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self'" />
    <title>Faber</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Pick the theme before the first paint, so a dark screen never flashes white. The real
      // choice is in the core's settings; this is the copy the shell kept from last time.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('faber.theme');
        } catch (e) {
          // Storage blocked: light, the default.
        }
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        // The colours of the style chosen last time (Settings → Appearance → Style).
        try {
          var tokens = JSON.parse(localStorage.getItem('faber.tokens') || 'null');
          var set = tokens && tokens[dark ? 'dark' : 'light'];
          for (var name in set) {
            if (/^--[a-z0-9-]+$/.test(name) && /^oklch\([0-9. /]+\)$/.test(set[name])) {
              root.style.setProperty(name, set[name]);
            }
          }
        } catch (e) {
          // Nothing remembered: tokens.css has the default style.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
