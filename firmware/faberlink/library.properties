name=FaberLink
version=0.1.0
author=Mikkel Ryborg Blom
maintainer=Mikkel Ryborg Blom
sentence=Connect an Arduino to Faber: its motors and sensors appear as parts, and it stops its own motors if Faber goes quiet.
paragraph=FaberLink is the serial protocol between the Faber core and a microcontroller. The library answers Faber's handshake, describes the board's parts, sends readings, applies commands, and enforces the safety rules on the board itself: a lost heartbeat, an expired lease or an e-stop puts every actuator in its safe state.
