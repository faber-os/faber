[workspace]
resolver = "3"
members = [
    "core",
    "sdk/rust/capabilities",
    "sdk/rust/connector",
    "sdk/rust/connector-wasm",
    "connectors/ldrobot-ld19",
    "core/tests/wasm-guests/misbehaving",
    "tools/arch-check",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/faber-os/faber"
authors = ["Mikkel Ryborg Blom"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
