[workspace]
resolver = "3"
members = [
    "core",
    "sdk/rust/app-wasm",
    "sdk/rust/capabilities",
    "sdk/rust/connector",
    "sdk/rust/connector-wasm",
    "sdk/rust/faberlink",
    "sdk/rust/flash",
    "connectors/ldrobot-ld19",
    "core/tests/wasm-guests/app-trap",
    "core/tests/wasm-guests/misbehaving",
    "examples/apps/sennep",
    "examples/apps/wall-follower",
    "tools/arch-check",
    "tools/faberlink-interop",
    "tools/faber-cli",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/faber-os/faber"
authors = ["Mikkel Ryborg Blom"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing (argon2id, 64 MiB) is far too slow unoptimised; the tests hash real passwords.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
