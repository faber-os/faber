<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wall follower</title>
    <link rel="stylesheet" href="style.css" />
    <!-- The page talks to Faber only through faber-shell.js (the @faber-os/shell SDK). -->
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>Wall follower</h1>
      <span id="state" class="state" data-on="false">…</span>
    </header>

    <section aria-labelledby="gap-label">
      <p id="gap-label" class="label">Distance to the wall</p>
      <p id="gap" class="value" data-testid="wall-distance">–</p>
      <div class="bar" aria-hidden="true">
        <div id="bar"></div>
        <span class="target"></span>
      </div>
      <p class="hint">It keeps the base's right side 0.3 m from the wall.</p>
    </section>

    <section aria-labelledby="speed-label">
      <label id="speed-label" class="label" for="speed">Speed along the wall</label>
      <div class="row">
        <input
          id="speed"
          type="range"
          min="0.05"
          max="0.5"
          step="0.05"
          value="0.25"
          data-testid="speed"
        />
        <output id="speed-value" for="speed" class="small-value">0.25 m/s</output>
      </div>
    </section>

    <p id="problem" class="problem" hidden></p>
    <p class="hint">
      Turn it on and off in Apps. Press Stop on the taskbar at any time: the
      base stops and the app waits.
    </p>
  </body>
</html>
