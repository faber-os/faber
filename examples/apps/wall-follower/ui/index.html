<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wall follower</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Wall follower</h1>
    <p>
      The base drives along the wall on its right, 0.3 m from it. Watch it in the World window,
      and its distance to the wall on <code>app:wall-follower/wall-distance</code>.
    </p>
    <p>Press Stop on the taskbar at any time: the base stops and the app waits.</p>
  </body>
</html>
