# The plan for the board "mega2560": which parts are on its pins. Faber writes mega2560.ino from it.
# Edit it in Faber, or here (Faber checks it when it is read). Your own code goes in my_code.h.

faber-board = 1
board = "mega2560"
name = "mega2560"

[parts.battery]
template = "battery"
shape = "divider"
pins = { sense = "A1" }
settings = { r1-ohm = 20000, r2-ohm = 10000, cells = 3, chemistry = "li-ion", capacity-ah = 0 }

[parts.bumper]
template = "bumper"
shape = "pin"
pins = { signal = 25 }
settings = { kind = "bumper" }

[parts.front]
template = "ultrasonic"
shape = "trig-echo"
pins = { trig = 22, echo = 23 }
settings = { min-m = 0.02, max-m = 4 }

[parts.front_2]
template = "ir-distance"
shape = "analog"
pins = { signal = "A0" }
settings = { min-m = 0.1, max-m = 0.8 }

[parts.front_3]
template = "ir-obstacle"
shape = "out"
pins = { signal = 26 }
settings = { trigger-distance-m = 0 }

[parts.left]
template = "motor"
shape = "pwm-dir"
pins = { pwm = 4, dir = 5 }
settings = { max-velocity-rad-s = 0 }

[parts.left_2]
template = "motor"
shape = "en-in1-in2"
pins = { en = 6, in1 = 7, in2 = 8 }
settings = { max-velocity-rad-s = 0 }

[parts.left_3]
template = "motor"
shape = "two-pwm"
pins = { in1 = 11, in2 = 12 }
settings = { max-velocity-rad-s = 0 }

[parts.start]
template = "button"
shape = "pin"
pins = { signal = 24 }
settings = { wiring = "to-gnd", debounce-ms = 20 }
