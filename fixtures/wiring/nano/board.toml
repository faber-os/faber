# The plan for the board "nano": which parts are on its pins. Faber writes nano.ino from it.
# Edit it in Faber, or here (Faber checks it when it is read). Your own code goes in my_code.h.

faber-board = 1
board = "nano"
name = "nano"

[parts.battery]
template = "battery"
shape = "divider"
pins = { sense = "A1" }
settings = { r1-ohm = 20000, r2-ohm = 10000, cells = 3, chemistry = "li-ion", capacity-ah = 0 }

[parts.bumper]
template = "bumper"
shape = "pin"
pins = { signal = "A3" }
settings = { kind = "bumper" }

[parts.front]
template = "ultrasonic"
shape = "trig-echo"
pins = { trig = 4, echo = 7 }
settings = { min-m = 0.02, max-m = 4 }

[parts.front_2]
template = "ir-distance"
shape = "analog"
pins = { signal = "A0" }
settings = { min-m = 0.1, max-m = 0.8 }

[parts.front_3]
template = "ir-obstacle"
shape = "out"
pins = { signal = "A4" }
settings = { trigger-distance-m = 0 }

[parts.led]
template = "led"
shape = "on-off"
pins = { out = 13 }

[parts.led_2]
template = "led"
shape = "dimmable"
pins = { out = 3 }

[parts.left]
template = "motor"
shape = "pwm-dir"
pins = { pwm = 5, dir = 8 }
settings = { max-velocity-rad-s = 0 }

[parts.left_2]
template = "motor"
shape = "en-in1-in2"
pins = { en = 6, in1 = 12, in2 = 9 }
settings = { max-velocity-rad-s = 0 }

[parts.left_3]
template = "motor"
shape = "two-pwm"
pins = { in1 = 11, in2 = 10 }
settings = { max-velocity-rad-s = 0 }

[parts.relay]
template = "relay"
shape = "in"
pins = { out = "A5" }
settings = { active = "low" }

[parts.start]
template = "button"
shape = "pin"
pins = { signal = "A2" }
settings = { wiring = "to-gnd", debounce-ms = 20 }
