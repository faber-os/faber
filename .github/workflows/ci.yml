# Everything must pass before a change lands (docs/development.md, ground rule 4).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # core/tests/wasm.rs builds connectors as WebAssembly components (docs/packages.md).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (serial port discovery)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes tools/faberlink-interop, which compiles the Arduino library's C++ core with the
      # runner's own compiler (g++ on Linux, MSVC on Windows) and tests it against the Rust side.
      - run: cargo test --workspace
        env:
          # The wasm connector tests skip themselves without the target; here they must run.
          FABER_REQUIRE_WASM: "1"
      - name: Crate dependency rules
        run: cargo run -p faber-arch-check
      - name: Generated shell types are up to date
        shell: bash
        run: git diff --exit-code -- shell/src/lib/api/generated || (echo "Run cargo test and commit the regenerated types." && exit 1)

  shell:
    name: Shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:arch
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  sdk:
    name: App SDK (@faber-os/shell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js/shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/js/shell/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end (real core + browser)
    runs-on: ubuntu-latest
    needs: [rust, shell]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
        working-directory: shell
      - run: npx playwright install --with-deps chromium
        working-directory: shell
      - name: Release build with the shell compiled in
        run: npm --prefix shell run build && cargo clippy -p faber-core --features embed-shell --all-targets -- -D warnings
      - run: npm run test:e2e
        working-directory: shell
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: shell/test-results

  arduino:
    name: Arduino library (examples for Uno and Mega)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index && arduino-cli core install arduino:avr
      - name: Every example compiles, and fits an Uno
        run: |
          for board in arduino:avr:uno arduino:avr:mega; do
            for example in firmware/faberlink/examples/*/; do
              arduino-cli compile --fqbn "$board" --library firmware/faberlink --warnings all "$example"
            done
          done
      # Guided mode's generated sketches (docs/wiring.md §5): every part template on every board,
      # spread over as many sketches as a board needs (uno, uno_2, ...), written by the core's
      # golden-file test. Any warning in them fails the build.
      - name: Every generated guided-board sketch compiles without warnings
        run: |
          for sketch in fixtures/wiring/*/; do
            id="$(basename "$sketch")"
            case "$id" in
              uno|uno_*) fqbn=arduino:avr:uno ;;
              nano|nano_*) fqbn=arduino:avr:nano:cpu=atmega328 ;;
              nano-old|nano-old_*) fqbn=arduino:avr:nano:cpu=atmega328old ;;
              mega2560|mega2560_*) fqbn=arduino:avr:mega:cpu=atmega2560 ;;
              *) echo "no FQBN for $id" && exit 1 ;;
            esac
            out="$(arduino-cli compile --fqbn "$fqbn" --library firmware/faberlink --warnings all "$sketch" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            if echo "$out" | grep -E "(\.ino|my_code\.h|FaberLink[A-Za-z]*\.(h|cpp)):[0-9]+:[0-9]+: warning:"; then
              echo "warnings in $id" && exit 1
            fi
          done
      # The example as ready firmware for Faber's Arduino flasher (docs/connect-an-arduino.md),
      # named as a package carries it: firmware/<board>.hex. Built here, never on a PC, so the
      # binary always matches the library in this commit.
      - name: The example as flasher firmware
        run: |
          mkdir -p faberlink-firmware/firmware
          for pair in uno:uno mega2560:mega; do
            id="${pair%%:*}"; fqbn="arduino:avr:${pair##*:}"
            arduino-cli compile --fqbn "$fqbn" --library firmware/faberlink \
              --output-dir "build/$id" firmware/faberlink/examples/MotorAndDistance
            cp "build/$id/MotorAndDistance.ino.hex" "faberlink-firmware/firmware/$id.hex"
          done
          ls -l faberlink-firmware/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: faberlink-example-firmware
          path: faberlink-firmware/

  wit:
    name: WIT interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: wasm-tools component wit wit/capabilities > /dev/null
      - name: The connector world, with the capability types it uses
        run: |
          mkdir -p "$RUNNER_TEMP/wit/deps"
          cp -r wit/capabilities "$RUNNER_TEMP/wit/deps/"
          cp wit/connector/*.wit "$RUNNER_TEMP/wit/"
          wasm-tools component wit "$RUNNER_TEMP/wit" > /dev/null
      - name: The app world, with the connector and capability types it uses
        run: |
          mkdir -p "$RUNNER_TEMP/app/deps/connector"
          cp -r wit/capabilities "$RUNNER_TEMP/app/deps/"
          cp wit/connector/*.wit "$RUNNER_TEMP/app/deps/connector/"
          cp wit/app/*.wit "$RUNNER_TEMP/app/"
          wasm-tools component wit "$RUNNER_TEMP/app" > /dev/null
