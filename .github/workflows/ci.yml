# Everything must pass before a change lands (docs/development.md, ground rule 4).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (serial port discovery)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Crate dependency rules
        run: cargo run -p faber-arch-check
      - name: Generated shell types are up to date
        shell: bash
        run: git diff --exit-code -- shell/src/lib/api/generated || (echo "Run cargo test and commit the regenerated types." && exit 1)

  shell:
    name: Shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:arch
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end (real core + browser)
    runs-on: ubuntu-latest
    needs: [rust, shell]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
        working-directory: shell
      - run: npx playwright install --with-deps chromium
        working-directory: shell
      - name: Release build with the shell compiled in
        run: npm --prefix shell run build && cargo clippy -p faber-core --features embed-shell --all-targets -- -D warnings
      - run: npm run test:e2e
        working-directory: shell
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: shell/test-results

  wit:
    name: WIT interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: wasm-tools component wit wit/capabilities > /dev/null
      - name: The connector world, with the capability types it uses
        run: |
          mkdir -p "$RUNNER_TEMP/wit/deps"
          cp -r wit/capabilities "$RUNNER_TEMP/wit/deps/"
          cp wit/connector/*.wit "$RUNNER_TEMP/wit/"
          wasm-tools component wit "$RUNNER_TEMP/wit" > /dev/null
