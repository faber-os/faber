[package]
name = "faber-core"
version = "0.1.0"
description = "The core of Faber, an open-source Raspberry Pi appliance OS for maker and robotics hardware. Early development; no usable API yet."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["raspberry-pi", "robotics", "embedded", "maker", "hardware"]
categories = ["embedded", "hardware-support"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
faber-capabilities = { version = "0.1.0", path = "../sdk/rust/capabilities", features = ["typescript"] }
faber-connector = { version = "0.1.0", path = "../sdk/rust/connector" }
futures-util = "0.3.34"
ldrobot-ld19 = { version = "0.1.0", path = "../connectors/ldrobot-ld19" }
rmp-serde = "1.3.1"
rust-embed = { version = "8.13.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
serialport = "4.10.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[features]
# Compiles the built shell (shell/dist) into the binary, for releases.
embed-shell = ["dep:rust-embed"]

[dev-dependencies]
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
