[package]
name = "faber-core"
version = "0.1.0"
description = "The core of Faber, an open-source Raspberry Pi appliance OS for maker and robotics hardware. Early development; no usable API yet."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["raspberry-pi", "robotics", "embedded", "maker", "hardware"]
categories = ["embedded", "hardware-support"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
faber-capabilities = { version = "0.1.0", path = "../sdk/rust/capabilities", features = ["typescript"] }
faber-connector = { version = "0.1.0", path = "../sdk/rust/connector" }
# FaberLink, the bridge protocol: the faber-bridge connector runs its session (docs/faberlink.md).
faberlink = { version = "0.1.0", path = "../sdk/rust/faberlink" }
futures-util = "0.3.34"
# Free and total space on the data folder's disk (GET /api/v0/storage). Only its statvfs is used.
fs4 = { version = "1.1.0", default-features = false }
# The machine's IANA time zone (GET /api/v0/system).
# Wall-clock time in an IANA zone: backup names and checking the time-zone setting.
jiff = "0.2.38"
ldrobot-ld19 = { version = "0.1.0", path = "../connectors/ldrobot-ld19" }
rmp-serde = "1.3.1"
rust-embed = { version = "8.13.0", optional = true, features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
serialport = "4.10.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# Runs wasm connectors as sandboxed components (docs/packages.md §3, D07, D09). No WASI: the
# only thing a connector can call is the core's `context`.
wasmtime = { version = "49.0.3", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "parallel-compilation"] }
# Backups (POST /api/v0/backups). Deflate only, in pure Rust.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Compiles the built shell (shell/dist) into the binary, debug builds too (`debug-embed`): a
# running core always serves the shell it was built with, never a newer one from disk.
embed-shell = ["dep:rust-embed"]

[dev-dependencies]
# Misbehaves on purpose, to test the wasm sandbox (tests/wasm.rs).
faber-test-guest = { version = "0.1.0", path = "tests/wasm-guests/misbehaving" }
# The Arduino library's C++ core as a fake board behind a fake serial port (bridge tests).
faberlink-interop = { path = "../tools/faberlink-interop" }
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
# Writes small test components from text, and wraps the wasm test guests as components.
wasmtime = { version = "49.0.3", default-features = false, features = ["wat"] }
wit-component = "0.262.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
wmi = { version = "0.18.4", default-features = false }
