# A 70 m² flat, 10 × 7 m. West half: a 1.2 m hallway (y 3.0–4.2) with a bedroom and a bathroom
# to the south and a kitchen and a study to the north. East half: the living room, through a
# 0.9 m doorway at the hallway's end. Doorways are 0.8–0.9 m: SENNEP (0.65 m wide) gets through
# with a few centimetres either side.
name = "apartment"
title = "Apartment"
description = "A 70 m² flat: hallway, bedroom, bathroom, kitchen, study and living room, joined by 0.8–0.9 m doorways. A sofa, and a dining table and chairs whose thin legs are hard for a LiDAR to see."
start = { x = 7.5, y = 2.5, yaw = 3.141592653589793 }
bounds = { min = [0.0, 0.0], max = [10.0, 7.0] }

[[outline]]
points = [[0.0, 0.0], [10.0, 0.0], [10.0, 7.0], [0.0, 7.0]]

# Hallway, south side: bedroom door at x 1.5–2.35, bathroom door at x 4.2–5.0.
