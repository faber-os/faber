# The Arduino Mega 2560's pins (docs/wiring.md §4): an ATmega2560 at 5 V.
#
# Sources, for every value below unless a line says otherwise:
# - the Arduino AVR core 1.8.8, variants/mega/pins_arduino.h: NUM_DIGITAL_PINS (70),
#   digitalPinHasPWM (2-13, 44-46), digital_pin_to_timer_PGM (which timer drives each PWM pin,
#   and the USART/I2C/SPI names in its comments), digitalPinToInterrupt (2, 3, 18-21),
#   digitalPinToPCICR (pin-change interrupts only on 10-13, 50-53 and A8-A15), PIN_SPI_* (50-53),
#   PIN_WIRE_SDA/SCL (20/21), LED_BUILTIN (13), PIN_A0-A15 (54-69), and SERIAL_PORT_HARDWARE1-3
#   (Serial1-3 exist);
# - the ATmega2560 datasheet: USART0 on PE0/PE1 (D0/D1, wired to the board's USB chip, so the
#   USB link to Faber), USART1 on PD2/PD3 (D19 RX1, D18 TX1), USART2 on PH0/PH1 (D17 RX2,
#   D16 TX2), USART3 on PJ0/PJ1 (D15 RX3, D14 TX3);
# - the Servo library 1.3.0, src/avr/ServoTimers.h: on the ATmega1280/2560 it takes Timer5 first,
#   then Timer1, Timer3 and Timer4, 12 servos per timer (Servo.h SERVOS_PER_TIMER). So the first
#   servo stops PWM on D44-D46, the 13th on D11/D12;
# - the core's Tone.cpp: tone() uses Timer2 on the ATmega2560 (USE_TIMER2), i.e. D9/D10.
#
# The tests in pins.rs check this file against those headers (pins.rs, `mega_matches_the_variant`).

faber-pins = 1
id = "mega2560"
name = "Arduino Mega 2560"
chip = "ATmega2560"
kind = "arduino"
logic-volts = 5.0
analog-reference-volts = 5.0
servo-timers = ["timer5", "timer1", "timer3", "timer4"]
servos-per-timer = 12
tone-timer = "timer2"

pins = [
  { name = "D0", number = 0, buses = ["serial:rx"] },
  { name = "D1", number = 1, buses = ["serial:tx"] },
  { name = "D2", number = 2, interrupt = 0, pwm = "timer3b" },
  { name = "D3", number = 3, interrupt = 1, pwm = "timer3c" },
  { name = "D4", number = 4, pwm = "timer0b" },
  { name = "D5", number = 5, pwm = "timer3a" },
  { name = "D6", number = 6, pwm = "timer4a" },
  { name = "D7", number = 7, pwm = "timer4b" },
  { name = "D8", number = 8, pwm = "timer4c" },
  { name = "D9", number = 9, pwm = "timer2b" },
  { name = "D10", number = 10, pin-change = true, pwm = "timer2a" },
  { name = "D11", number = 11, pin-change = true, pwm = "timer1a" },
  { name = "D12", number = 12, pin-change = true, pwm = "timer1b" },
  { name = "D13", number = 13, pin-change = true, pwm = "timer0a", led = true },
  { name = "D14", number = 14, buses = ["serial3:tx"] },
  { name = "D15", number = 15, buses = ["serial3:rx"] },
  { name = "D16", number = 16, buses = ["serial2:tx"] },
  { name = "D17", number = 17, buses = ["serial2:rx"] },
  { name = "D18", number = 18, interrupt = 5, buses = ["serial1:tx"] },
  { name = "D19", number = 19, interrupt = 4, buses = ["serial1:rx"] },
  { name = "D20", number = 20, interrupt = 3, buses = ["i2c:sda"] },
  { name = "D21", number = 21, interrupt = 2, buses = ["i2c:scl"] },
  { name = "D22", number = 22 },
  { name = "D23", number = 23 },
  { name = "D24", number = 24 },
  { name = "D25", number = 25 },
  { name = "D26", number = 26 },
  { name = "D27", number = 27 },
  { name = "D28", number = 28 },
  { name = "D29", number = 29 },
  { name = "D30", number = 30 },
  { name = "D31", number = 31 },
  { name = "D32", number = 32 },
  { name = "D33", number = 33 },
  { name = "D34", number = 34 },
  { name = "D35", number = 35 },
  { name = "D36", number = 36 },
  { name = "D37", number = 37 },
  { name = "D38", number = 38 },
  { name = "D39", number = 39 },
  { name = "D40", number = 40 },
  { name = "D41", number = 41 },
  { name = "D42", number = 42 },
  { name = "D43", number = 43 },
  { name = "D44", number = 44, pwm = "timer5c" },
  { name = "D45", number = 45, pwm = "timer5b" },
  { name = "D46", number = 46, pwm = "timer5a" },
  { name = "D47", number = 47 },
  { name = "D48", number = 48 },
  { name = "D49", number = 49 },
  { name = "D50", number = 50, pin-change = true, buses = ["spi:miso"] },
  { name = "D51", number = 51, pin-change = true, buses = ["spi:mosi"] },
  { name = "D52", number = 52, pin-change = true, buses = ["spi:sck"] },
  { name = "D53", number = 53, pin-change = true, buses = ["spi:ss"] },
  { name = "A0", number = 54, analog = 0 },
  { name = "A1", number = 55, analog = 1 },
  { name = "A2", number = 56, analog = 2 },
  { name = "A3", number = 57, analog = 3 },
  { name = "A4", number = 58, analog = 4 },
  { name = "A5", number = 59, analog = 5 },
  { name = "A6", number = 60, analog = 6 },
  { name = "A7", number = 61, analog = 7 },
  { name = "A8", number = 62, pin-change = true, analog = 8 },
  { name = "A9", number = 63, pin-change = true, analog = 9 },
  { name = "A10", number = 64, pin-change = true, analog = 10 },
  { name = "A11", number = 65, pin-change = true, analog = 11 },
  { name = "A12", number = 66, pin-change = true, analog = 12 },
  { name = "A13", number = 67, pin-change = true, analog = 13 },
  { name = "A14", number = 68, pin-change = true, analog = 14 },
  { name = "A15", number = 69, pin-change = true, analog = 15 },
]

[[reserved]]
pins = ["D0", "D1"]
reason = "D0 and D1 carry the USB link to Faber (Serial). Serial1-3 on D14-D19 are free."

[[notes]]
pins = ["D13"]
note = "D13 also drives the on-board LED: fine for an output, weak as an input with a pull-up."
avoid = ["digital-in"]

# The headers, for drawing the board in the pin picker: only the order of the positions along
# each header. From Arduino's published Mega 2560 Rev3 pinout (top view, USB and power jack on
# the left): along the top the Uno's digital headers (SCL/SDA copies of D21/D20, AREF, GND,
# D13 … D8, D7 … D0) and then D14 … D21; along the bottom the power header (NC, IOREF, RESET, 3V3,
# 5V, GND, GND, VIN), A0 … A7 and A8 … A15; at the right end the double header, pair by pair
# from the top: 5V 5V, D22 D23, … D52 D53, GND GND (even pins on the inner row).
[[headers]]
edge = "top"
positions = ["SCL", "SDA", "AREF", "GND", "D13", "D12", "D11", "D10", "D9", "D8"]

[[headers]]
edge = "top"
positions = ["D7", "D6", "D5", "D4", "D3", "D2", "D1", "D0"]

[[headers]]
edge = "top"
positions = ["D14", "D15", "D16", "D17", "D18", "D19", "D20", "D21"]

[[headers]]
edge = "bottom"
positions = ["NC", "IOREF", "RESET", "3V3", "5V", "GND", "GND", "VIN"]

[[headers]]
edge = "bottom"
positions = ["A0", "A1", "A2", "A3", "A4", "A5", "A6", "A7"]

[[headers]]
edge = "bottom"
positions = ["A8", "A9", "A10", "A11", "A12", "A13", "A14", "A15"]

[[headers]]
edge = "right"
rows = 2
positions = [
  "5V", "5V",
  "D22", "D23", "D24", "D25", "D26", "D27", "D28", "D29", "D30", "D31",
  "D32", "D33", "D34", "D35", "D36", "D37", "D38", "D39", "D40", "D41",
  "D42", "D43", "D44", "D45", "D46", "D47", "D48", "D49", "D50", "D51",
  "D52", "D53",
  "GND", "GND",
]
