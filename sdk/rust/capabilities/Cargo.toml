[package]
name = "faber-capabilities"
version = "0.1.0"
description = "Faber capability data types (the Rust mirror of wit/capabilities)."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
rmp-serde = "1.3.1"
serde_json = "1.0.154"

[features]
# Generates TypeScript types for the shell (codegen only, no I/O).
typescript = ["dep:ts-rs"]
